services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knit
      POSTGRES_PASSWORD: knit
      POSTGRES_DB: knitting
    # Host port 5433 so it doesn't collide with a locally installed Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - knitting-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knit -d knitting"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  knitting-db:
